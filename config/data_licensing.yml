  - source: bis
    license_type: attribution-noncommercial
    review_status: provisional
    source_of_truth: >
      Secondary reporting of the BIS published terms. The primary page
      (terms_url) could NOT be read when this entry was written: egress to
      bis.org is blocked by the authoring environment's network policy.
      A human must read terms_url and set review_status: verified with
      their name in reviewed_by before anything BIS-derived is
      redistributed outside the organisation.
    redistribution_allowed: true
    commercial_use_allowed: false
    attribution_required: true
    terms_url: https://www.bis.org/terms_conditions.htm
    last_reviewed_date: "2026-08-13"
    notes: >
      Bank for International Settlements. The BIS retains copyright and other
      intellectual property rights in all statistical data on its website
      ("BIS Material"). Its published terms permit users to download, display,
      print and REDISTRIBUTE BIS Material without written permission FOR
      NON-COMMERCIAL PURPOSES; commercial use is not covered by that grant and
      needs permission from the BIS. Attribution to the BIS as source is
      expected, and unlike the U.S. federal sources this is a copyright
      condition rather than a preference.

      Practical effect here: manifests/bis_policy_rates.yml (36 active policy
      rate series) feeds gold.global_policy_rates and the Power BI Global Macro
      Monitor. Internal and non-commercial analysis and redistribution are
      fine with attribution; a commercially distributed product built on these
      series needs BIS permission first, which is why commercial_use_allowed
      is false and `validate --commercial` flags it.

      Sourced from the BIS's published terms-and-conditions page, which could
      not be fetched directly from the environment this entry was written in
      (egress to bis.org is blocked). Re-read terms_url and bump
      last_reviewed_date before relying on this for a real compliance
      decision, particularly before any commercial distribution.

  - source: oecd
    license_type: requires-agreement
    review_status: provisional
    source_of_truth: >
      Not a primary read. OECD publishes its statistics openly via a keyless
      public SDMX API, but its terms distinguish OECD-owned material from
      third-party data redistributed through the same catalogue (the dataflow
      list includes flows owned by ESTAT and IAEG-SDGs, not just OECD), so a
      blanket "open data" assumption would be wrong.
    redistribution_allowed: false
    commercial_use_allowed: false
    attribution_required: true
    terms_url: https://www.oecd.org/en/about/terms-conditions.html
    last_reviewed_date: "2026-09-12"
    notes: >
      Added with specs/spec006's first OECD series set (Composite Leading
      Indicators). redistribution_allowed is false by deliberate project
      decision, not by a finding that OECD forbids it -- spec006 open decision
      #3 settled the posture as internal use only. That is also what keeps
      `validate --licensing-review` green without a primary terms read, since
      that gate only fails sources which *permit* redistribution while
      unverified. If the posture ever changes to external redistribution, this
      entry needs a real primary read and a named reviewed_by first.

