# Per-source data-licensing register (docs/handoffs/governance_and_access_control.md
# item 1). Tracks what this pipeline is actually allowed to do with each
# upstream source's data -- not just what it *pulls*. See
# fred_pipeline.governance.licensing for the loader and
# `fred_pipeline validate --commercial` for the guardrail this feeds.
#
# Populated from each source's generally-published policy (U.S. federal
# statistical agencies are public domain; World Bank Open Data is CC BY 4.0)
# plus this project's own prior research (Tiingo's personal-use decision,
# already recorded in docs/handoffs/completed/handoff.md; the iShares
# holdings-CSV caveat already noted in sources/ishares.py) -- not a fresh
# live fetch of every terms page in one pass.
#
# review_status records HOW MUCH AUTHORITY an entry carries, so a researched
# entry cannot be mistaken for a signed-off one:
#
#   verified     a human read terms_url and signed off. REQUIRES reviewed_by --
#                a verification nobody's name is on is an assertion, not a
#                review. Goes stale after two years; terms change.
#   provisional  researched from secondary sources. Fine to operate on
#                internally; NOT a basis for external redistribution.
#   unreviewed   placeholder -- treat the source as unknown.
#
# `fred_pipeline validate --licensing-review` FAILS while any source that
# permits redistribution is unverified. U.S. federal sources are exempt: they
# are public domain by statute (17 U.S.C. 105), not by a terms page.
#
# Every entry below is currently `provisional`. Nobody has performed a primary
# read. Clear the ones that matter before publishing externally.

sources:
  - source: fred
    license_type: public-domain
    review_status: provisional
    source_of_truth: >
      U.S. federal government work, public domain by statute
      (17 U.S.C. 105) rather than by a terms page. Exempt from the
      redistribution-review check for that reason.
    redistribution_allowed: true
    commercial_use_allowed: true
    attribution_required: false
    terms_url: https://fred.stlouisfed.org/copyright.html
    last_reviewed_date: "2026-07-26"
    notes: >
      U.S. federal government work (Federal Reserve Bank of St. Louis), not
      subject to copyright under 17 U.S.C. Section 105. Citation is FRED's
      stated preference, not a legal requirement. Some FRED series (the
      BAML* ICE BofA indices in manifests/ice_credit.yml and
      manifests/corporate_bond_yields.yml) originate from ICE Data Indices
      and are redistributed via FRED -- FRED's own terms cover the
      redistribution, but this is worth a closer look if ICE's upstream
      terms ever become a concern independent of FRED's.

