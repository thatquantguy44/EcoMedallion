# Warehouse storage backend configuration
#
# This file controls where Gold layer tables are written.
#
# Backends:
#   - local       : SQLite file on disk (selected by --local, or the built-in
#                   fallback when this file is missing)
#   - databricks  : Delta Lake on Databricks (production)
#   - postgres    : PostgreSQL (write/read backend; local or service target)
#   - duckdb      : DuckDB file (future, experimental)
#   - none        : In-memory only (dry-run, no writes)
#
# Primary vs. fallback: if primary_backend fails to initialize,
# fallback_backends are tried in order. If all fail, pipeline runs
# in-memory only (no warehouse writes).
#
# Precedence: CLI flags > environment variables > config file > defaults

# --- DEFAULT CONFIGURATION (dev/test/prod without overrides) ---

default:
  # Primary backend for all environments. Override per-environment below.
  primary_backend: postgres

  # Fallback chain if primary fails. Leave empty for no fallbacks.
  fallback_backends: []
    # - duckdb
    # - none  (uncomment to allow in-memory fallback)

  # Backend-specific settings (only the active backends need config)
  backends:
    local:
      # Path to SQLite database file. Relative paths are relative to CWD.
      db_path: ./fred.db

    databricks:
      # Databricks workspace and warehouse connection
      # (requires DATABRICKS_HOST and DATABRICKS_TOKEN env vars or config)
      workspace_url: https://my-workspace.cloud.databricks.com
      http_path: /sql/1.0/warehouses/abc123def456
      # Catalog name (maps to macro_dev / macro_test / macro_prod per environment)
      # Omit to use PipelineConfig.environment.catalog
      catalog: macro_dev

    postgres:
      # Select the Postgres target profile:
      #   local   = localhost/Docker/dev database; defaults to
      #             postgresql://fred:fred@localhost:55432/macro_medallion unless a DSN
      #             env var is provided.
      #   service = managed/hosted Postgres; requires a DSN from dsn, dsn_env,
      #             FRED_POSTGRES_SERVICE_DSN, DATABASE_URL, or
      #             FRED_POSTGRES_DSN.
      #
      # Docker vs. a native install -- the port differs, and both are valid:
      #   `docker compose up -d postgres` (docker-compose.yml, this repo's
      #   documented default) maps the container's Postgres to host port
      #   55432, already configured with the fred/fred/macro_medallion
      #   role/database/password below -- no extra setup needed.
      #   A natively-installed Postgres (e.g. the official EnterpriseDB
      #   macOS installer, or `brew install postgresql`) instead listens on
      #   the standard default port 5432, under whatever superuser/role
      #   setup that installer created -- it will NOT already have a `fred`
      #   role or `macro_medallion` database; create them yourself first
      #   (`CREATE ROLE fred LOGIN PASSWORD 'fred';
      #   CREATE DATABASE macro_medallion OWNER fred;`) as that install's
      #   own superuser, then point FRED_POSTGRES_LOCAL_DSN at port 5432
      #   instead of 55432. `PostgresWarehouse` auto-creates the
      #   meta/audit/bronze/silver/gold schemas and tables on first connect
      #   either way -- only the role/database creation step is manual for
      #   a native install. Don't assume a Postgres process you find running
      #   locally is this project's target without checking its actual port
      #   and superuser first; a native install and the Docker Compose
      #   target are two independent things that can both exist on the same
      #   machine (see docs/handoffs/pipeline_performance.md's Postgres
      #   section for a real example of this exact mix-up).
      target: local
      dsn_env: FRED_POSTGRES_LOCAL_DSN
      # dsn: postgresql://fred:fred@localhost:55432/macro_medallion  # Docker Compose (documented default)
      # dsn: postgresql://fred:fred@localhost:5432/macro_medallion   # native install, once fred/macro_medallion exist
      # For service mode, prefer secrets in env vars:
      # target: service
      # dsn_env: FRED_POSTGRES_SERVICE_DSN
      # Or use discrete fields when appropriate:
      # host: localhost
      # port: 55432
      # database: macro_medallion
      # user: fred
      # password: ${FRED_POSTGRES_PASSWORD}

    duckdb:
      # DuckDB file path (not yet implemented)
      db_path: ./fred.duckdb

# --- ENVIRONMENT-SPECIFIC OVERRIDES ---

environments:
  # dev: (inherits from default: postgres -- start it with
  #       `docker compose up -d postgres`; pass --local for SQLite instead)

  test:
    # test environment can use either local SQLite or Databricks
    primary_backend: local
    fallback_backends: []
    backends:
      local:
        db_path: ./fred_test.db

  prod:
    # Production uses Databricks with in-memory fallback
    primary_backend: databricks
    fallback_backends:
      - duckdb
      - local
    backends:
      databricks:
        workspace_url: https://prod-workspace.cloud.databricks.com
        http_path: /sql/1.0/warehouses/prod_warehouse_id
        catalog: macro_prod
      duckdb:
        db_path: /mnt/backups/fred_backup.duckdb
      local:
        db_path: /tmp/fred_emergency.db  # fallback only

# --- HOW TO USE ---
#
# 1. LOCAL DEVELOPMENT (default: Postgres; needs `docker compose up -d postgres`):
#    python -m fred_pipeline run --env dev
#    → Writes to the postgres backend configured above. If it cannot be
#      reached the run stops with exit code 2 before extracting anything.
#
# 2. LOCAL SQLITE WITH EXPLICIT PATH:
#    python -m fred_pipeline run --env dev --local --db-path /path/to/fred.db
#    → CLI flag overrides config file (highest precedence)
#
# 3. DATABRICKS:
#    FRED_API_KEY=... DATABRICKS_HOST=... DATABRICKS_TOKEN=... \
#    python -m fred_pipeline run --env prod
#    → Uses config from this file, environment overrides active
#
# 4. DRY RUN (in-memory, no writes):
#    FRED_API_KEY=... python -m fred_pipeline run --env dev --dry-run
#    → Ignores all warehouse config
#
# 5. FORCE FALLBACK CHAIN:
#    If primary backend fails, fallbacks are tried automatically.
#    To force a specific backend, use --local or --dry-run CLI flags.
#
# Environment variables that affect warehouse resolution:
#   - FRED_WAREHOUSE_CONFIG  : Path to this file (if not config/warehouse.yml)
#   - DATABRICKS_HOST        : Databricks workspace URL (if not in config)
#   - DATABRICKS_TOKEN       : Databricks personal access token
#   - FRED_LOCAL_DB_PATH     : SQLite path override
#   - FRED_POSTGRES_LOCAL_DSN   : Local Postgres DSN override
#   - FRED_POSTGRES_SERVICE_DSN : Managed/service Postgres DSN
#   - FRED_POSTGRES_DSN         : Generic Postgres DSN fallback
#   - DATABASE_URL              : Service Postgres DSN fallback
#
# Logs will show which backend was selected and any fallback attempts.
