[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fred-pipeline"
version = "0.1.0"
description = "Manifest-driven FRED API Bronze-to-Gold ingestion pipeline for Databricks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project Contributors" }]
keywords = ["fred", "databricks", "delta-lake", "etl", "macro", "quant"]

dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# PySpark/Delta are provided by the Databricks runtime; pin locally for dev.
spark = ["pyspark>=3.5", "delta-spark>=3.1"]
# Optional: vectorizes the local (SQLite) backend's Gold-layer rebuild for
# large series universes. Lazily imported; local backend falls back to the
# pure-Python implementation if it's absent.
local = ["polars>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "jsonschema>=4.0",
    "responses>=0.24",
]

[project.scripts]
fred-pipeline = "fred_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pin the rule set to ruff's historical default (pycodestyle errors + pyflakes).
#
# .pre-commit-config.yaml states the intent plainly: ruff-check runs with --fix
# but "no opt-in strict rule sets, so it won't surface a wall of pre-existing
# violations" on a mature codebase that has never been linted. That held while
# ruff's default was E4/E7/E9/F -- but ruff's defaults have since widened, and
# with them the hook started reporting 318 violations across src/ (UP045, UP035,
# I001, BLE001, DTZ011, ...), which blocked commits to any .py file and
# auto-rewrote unrelated lines in every file it touched.
#
# Pinning restores the documented intent rather than silently inheriting
# whatever a future ruff release decides to enable. Widening this list is a
# deliberate choice to make, ideally one rule family at a time with the
# resulting cleanup in its own commit -- not something to acquire by upgrading.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["fred_pipeline"]
branch = true
