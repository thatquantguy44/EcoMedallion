name: bea_pce_items
description: >
  BEA NIPA Underlying Detail Table 2.4.4U — "Price Indexes for Personal Consumption Expenditures
  by Type of Product" (monthly, SA). Provides item-level PCE price indexes for
  the Inflation Explorer (gold.inflation_explorer / gold.inflation_contribution).
  Uses the BEA API source (source: bea); series_id format is
  '<dataset>:<table>:<line>:<frequency>' e.g. 'NIUnderlyingDetail:U20404:2:M'.

  All table lines share one captured table per run. BEAClient fetches monthly
  history in bounded year batches; normalize_bea_observations selects each
  LineNumber. The 21 series reuse those batches instead of refetching the table.

  Active series require BEA_API_KEY. Dataset, monthly frequency, line descriptions,
  and provider series codes were verified against GetParameterValues/GetData on
  2026-11-10. Standard NIPA T20404 supports annual/quarterly data only; monthly
  U20404 has different line numbers. Line 1 (PCE headline) is PCEPI on FRED and
  is already ingested via manifests/inflation.yml — skip it here.
  API reference: https://apps.bea.gov/api/_pdf/bea_web_service_api_user_guide.pdf
version: 1

series:
  # --- major spending aggregates ---
  - series_id: "NIUnderlyingDetail:U20404:2:M"
    title: PCE Price Index - Goods (SA)
    category: inflation
    frequency: m
    units: Index 2017=100
    active: true
    source: bea
    load_type: incremental
    expected_update_frequency: monthly
    vintage_enabled: false
    validation_profile: standard
    downstream_use_case: inflation_explorer
    priority: 2
    min_value: 0
    tags: [pce, goods, bea, inflation]

