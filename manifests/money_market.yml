name: money_market
description: >
  Series added for the terminal's money-market optimizer (MMKT; specs/spec009).
  One manifest per series: every other money-market rate MMKT reads (SOFR, EFFR,
  IORB, OBFR, TGCRRATE, RRPONTSYAWARD, DTB4WK/DTB3/DTB6, DGS1MO/3MO/6MO, DCPF3M)
  is already declared by rates.yml or fed_funding.yml and is deliberately NOT
  repeated here -- see config/mmkt_instruments.yml for the full instrument map.

  Activated after the 2026-10-18 live probe resolved the id and confirmed daily
  Percent observations. FRED's metadata does not state a quoting basis, so the
  configured discount basis remains a manual verification item before pricing
  from its normalized yield:

      python scripts/probe_mmkt_series.py --fred-key "$FRED_API_KEY"

  The probe confirms the id resolves, reports its title/units/frequency, and
  flags a quoting basis that disagrees with config/mmkt_instruments.yml.
  The snapshot reports missing/stale status explicitly; consumers must check
  status before pricing.
version: 1

series:
  - series_id: DCPN3M
    title: 90-Day AA Nonfinancial Commercial Paper Interest Rate
    category: rates
    frequency: d
    expected_update_frequency: daily
    units: Percent
    active: true            # id confirmed live; discount basis still needs review
    vintage_enabled: false  # published market rate, not revised
    validation_profile: standard
    downstream_use_case: mmkt
    priority: 3
    min_value: -1
    max_value: 25
    tags: [rates, money_market, commercial_paper, mmkt]
