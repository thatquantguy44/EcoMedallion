name: corporate_bond_yields
description: >
  Corporate bond yield/spread series discovered via `fred_pipeline discover
  --search "corporate bond yield"` (docs/handoffs/asset_class_expansion.md
  item 2 — closes the free/aggregate half of the gap; individual-issuer
  CUSIP-level pricing and municipal curves need TRACE/a paid vendor and are
  out of scope). Moody's seasoned Aaa/Baa corporate yields (with 10Y-Treasury-
  and Fed-Funds-relative spreads) plus ICE BofA yield-to-worst and
  total-return-index cuts across the rating ladder, complementing the
  OAS/effective-yield series already in manifests/ice_credit.yml. Trimmed of
  7 lower-frequency duplicates (weekly/monthly cuts of a series already kept
  at daily) from the raw discover output.
