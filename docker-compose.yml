services:
  postgres:
    image: postgres:16
    container_name: fred-pipeline-postgres
    # Comes back on its own whenever Docker Desktop starts, so a reboot doesn't
    # silently leave the warehouse unreachable. "unless-stopped" and not
    # "always": an explicit `docker compose stop` stays stopped.
    restart: unless-stopped
    environment:
      POSTGRES_DB: macro_medallion
      POSTGRES_USER: fred
      POSTGRES_PASSWORD: fred
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fred -d macro_medallion"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fred_postgres_data:/var/lib/postgresql/data

volumes:
  fred_postgres_data:
