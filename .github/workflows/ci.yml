name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Run unit tests
        run: pytest -q

  spark-integration:
    name: Spark + Delta integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PySpark + Delta
        run: |
          pip install -r requirements-dev.txt
          pip install "pyspark==3.5.3" "delta-spark==3.2.0"
          pip install -e .
      - name: Run Spark/Delta integration tests
        run: pytest -q tests/test_spark_integration.py

  dagster-integration:
    name: Dagster jobs (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster_test
          POSTGRES_PASSWORD: dagster_test
          POSTGRES_DB: dagster_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U dagster_test -d dagster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ECB_POSTGRES_DSN: postgresql://dagster_test:dagster_test@localhost:55433/dagster_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[postgres,dagster,dev]' -c requirements-dagster.lock.txt
      - name: Verify jobs, launch configs, read-only health and writer contention
        run: >-
          pytest -q tests/test_dagster_jobs.py tests/test_job_runtime.py
          tests/test_dagster_postgres.py tests/test_ecb_writer_lock.py
          tests/test_ecb_writer_boundaries.py tests/test_ecb_health.py

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fred
          POSTGRES_PASSWORD: fred
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fred -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[postgres]' pytest
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/test_postgres_warehouse.py
