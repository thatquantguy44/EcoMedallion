name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - name: Run unit tests with baseline artifacts
        run: |
          mkdir -p artifacts/test-baseline
          python -m pytest --strict-markers -m unit \
            --ignore=tests/test_spark_integration.py \
            --junitxml=artifacts/test-baseline/unit-junit.xml \
            --cov=fred_pipeline --cov-branch \
            --cov-report=xml:artifacts/test-baseline/unit-coverage.xml \
            --cov-report=json:artifacts/test-baseline/unit-coverage.json
      - name: Upload unit baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-baseline-py${{ matrix.python-version }}
          path: artifacts/test-baseline/
          if-no-files-found: error

  spark-integration:
    name: Spark + Delta integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PySpark + Delta
        run: |
          python -m pip install -e ".[dev]" \
            "pyspark==3.5.3" "delta-spark==3.2.0"
      - run: python -m pip check
      - name: Run Spark/Delta integration tests
        run: python -m pytest --strict-markers -m spark

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fred
          POSTGRES_PASSWORD: fred
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fred -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[postgres,dev]'
      - run: python -m pip check
      - name: Run PostgreSQL integration tests
        run: python -m pytest --strict-markers -m postgres
